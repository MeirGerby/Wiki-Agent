verify:
  stage: verify
  image: $CI_NODE_IMAGE
  variables:
    PNPM_HOME: $CI_PROJECT_DIR/.pnpm-store
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - npm config set registry "$NPM_REGISTRY"
    - npm config set strict-ssl false
    - npm install -g pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")
    - pnpm config set registry "$NPM_REGISTRY"
    - pnpm config set strict-ssl false
    - pnpm config set store-dir "$PNPM_HOME"
    - pnpm install --frozen-lockfile
  script:
    - pnpm exec nx sync:check
    - pnpm format:check
    # MR pipelines only build what changed; branch/tag pipelines build everything.
    - |
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        pnpm exec nx affected -t lint typecheck build test --base="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      else
        pnpm exec nx run-many -t lint typecheck build test
      fi
