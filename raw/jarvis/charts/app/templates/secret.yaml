{{- if .Values.secret.enabled }}
{{- $secretName := include "app.fullname" . }}
{{- $live := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $data := dict }}
{{- if $live }}{{- $data = $live.data | default dict }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    # A rollback or an uninstall must not take the keys with it.
    helm.sh/resource-policy: keep
type: Opaque
# Upgrades copy back the keys the cluster already holds, so hand edits survive. lookup
# returns them already base64 encoded, so they go back under data, not stringData.
data:
  {{- if $data }}
  {{- toYaml $data | nindent 2 }}
  {{- else }} {}
  {{- end }}
{{- end }}
