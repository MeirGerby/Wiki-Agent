include:
  - local: .gitlab/ci/verify.yml
  - local: .gitlab/ci/build.yml
  - local: .gitlab/ci/deploy.yml
  - local: .gitlab/ci/contexts/model-catalog.yml

stages: [verify, build, deploy]

variables:
  GIT_DEPTH: 0
  NX_NO_CLOUD: 'true'
  GIT_SSL_NO_VERIFY: 'true'

  # These are defaults. A project or group CI/CD variable of the same name beats them,
  # which is how a closed network points them at its own mirrors.
  CI_NODE_IMAGE: node:24
  BASE_IMG: node:24-alpine
  DEPLOY_IMAGE: $JENKINS_DEPLOY_IMAGE
  KANIKO_IMAGE: $KANIKO_BUILD_IMAGE
  NPM_REGISTRY: https://registry.npmjs.org/

default:
  tags:
    - '${RUNNERS_TAG}'
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
